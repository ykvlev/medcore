# Render Blueprint: сервер MEDCORE в Docker-контейнере.
# Секреты (строка подключения и домен клиента) задаются в панели Render.
services:
  - type: web
    name: medcore-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Клиент и API на разных доменах: cookie должна быть SameSite=None.
      - key: MEDCORE_COOKIE_SAMESITE
        value: None
      # Домен клиента на Vercel, например https://medcore.vercel.app
      - key: MEDCORE_FRONTEND_ORIGINS
        sync: false
      # Строка подключения в формате URI (Neon): postgresql://user:pass@host/db
      - key: DATABASE_URL
        sync: false
